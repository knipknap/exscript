    "Exscript.protocols.drivers.ace",
    "Exscript.protocols.drivers.adtran",
    "Exscript.protocols.drivers.aironet",
    "Exscript.protocols.drivers.aix",
    "Exscript.protocols.drivers.arbor_peakflow",
    "Exscript.protocols.drivers.aruba",
    "Exscript.protocols.drivers.bigip",
    "Exscript.protocols.drivers.brocade",
    "Exscript.protocols.drivers.cienasaos",
    "Exscript.protocols.drivers.driver",
    "Exscript.protocols.drivers.enterasys",
    "Exscript.protocols.drivers.enterasys_wc",
    "Exscript.protocols.drivers.eos",
    "Exscript.protocols.drivers.ericsson_ban",
    "Exscript.protocols.drivers.fortios",
    "Exscript.protocols.drivers.generic",
    "Exscript.protocols.drivers.hp_pro_curve",
    "Exscript.protocols.drivers.icotera",
    "Exscript.protocols.drivers.ios",
    "Exscript.protocols.drivers.ios_xr",
    "Exscript.protocols.drivers.isam",
    "Exscript.protocols.drivers.junos",
    "Exscript.protocols.drivers.junos_erx",
    "Exscript.protocols.drivers.mrv",
    "Exscript.protocols.drivers.nxos",
    "Exscript.protocols.drivers.one_os",
    "Exscript.protocols.drivers.rios",
    "Exscript.protocols.drivers.shell",
    "Exscript.protocols.drivers.smart_edge_os",
    "Exscript.protocols.drivers.sp_vxoa",
    "Exscript.protocols.drivers.sros",
    "Exscript.protocols.drivers.vrp",
    "Exscript.protocols.drivers.vxworks",
    "Exscript.protocols.drivers.zte",
    "Exscript.protocols.drivers.zyxel",
    "Exscript.protocols.dummy",
    "Exscript.protocols.exception",
    "Exscript.protocols.netconf",
    "Exscript.protocols.osguesser",
    "Exscript.protocols.protocol",
    "Exscript.protocols.ssh2",
    "Exscript.protocols.telnet",
    "Exscript.protocols.telnetlib",
    "Exscript.queue",
    "Exscript.servers.httpd",
    "Exscript.servers.server",
    "Exscript.servers.sshd",
    "Exscript.servers.telnetd",
    "Exscript.stdlib.connection",
    "Exscript.stdlib.crypt",
    "Exscript.stdlib.file",
    "Exscript.stdlib.ipv4",
    "Exscript.stdlib.list",
    "Exscript.stdlib.mysys",
    "Exscript.stdlib.string",
    "Exscript.stdlib.util",
    "Exscript.util.buffer",
    "Exscript.util.cast",
    "Exscript.util.collections",
    "Exscript.util.crypt",
    "Exscript.util.decorator",
    "Exscript.util.event",
    "Exscript.util.file",
    "Exscript.util.impl",
    "Exscript.util.interact",
    "Exscript.util.ip",
    "Exscript.util.ipv4",
    "Exscript.util.ipv6",
    "Exscript.util.log",
    "Exscript.util.mail",
    "Exscript.util.match",
    "Exscript.util.report",
    "Exscript.util.sigint",
    "Exscript.util.start",
    "Exscript.util.syslog",
    "Exscript.util.template",
    "Exscript.util.tty",
    "Exscript.util.url",
    "Exscript.util.weakmethod",
    "Exscript.util.xml",
    "Exscript.workqueue.job",
    "Exscript.workqueue.mainloop",
    "Exscript.workqueue.pipeline",
    "Exscript.workqueue.task",
    "Exscript.workqueue.workqueue",
]
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
warn_return_any = false
implicit_reexport = true
strict_equality = false
extra_checks = false

[tool.interrogate]
# Docstring coverage (P8). Private functions count; other dunder methods than
# __init__, nested functions and property setters do not. Raise fail-under as
# docstrings are added; the goal is 100.
fail-under = 49
ignore-magic = true
ignore-nested-functions = true
ignore-setters = true
exclude = ["docs", "tests", "tools", "demos", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*Test.py"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = [
    "error",
    # The process mode of the queue forks a process that has threads (Python 3.12 and 3.13).
    "ignore:This process .* is multi-threaded, use of fork\\(\\) may lead to deadlocks:DeprecationWarning",
    # lxml enables the GIL of free-threaded Python; CI runs these tests with PYTHON_GIL=0.
    "ignore:The global interpreter lock \\(GIL\\) has been enabled:RuntimeWarning",
]
