# Read the Docs: https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_checkout:
      # hatch-vcs takes the version from the git tags, which a shallow clone lacks.
      - git fetch --unshallow --tags || true
python:
  install:
    - method: uv
      command: sync
      groups: [docs]
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
