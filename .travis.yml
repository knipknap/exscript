language: python
python:
  - "3.11"
  - "3.12"
  - "3.13"
  - "3.14"
# command to install dependencies
install:
  - "pip install -r requirements.txt"
  - "pip install coveralls"
# command to run tests
script: travis_wait coverage run --source=Exscript -m unittest discover -v tests/Exscript "*Test.py"
after_success:
  coveralls
