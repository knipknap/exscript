name: Link check

# External links break without a change in this repository, so they are
# checked weekly instead of on every pull request.
on:
  schedule:
    - cron: "17 5 * * 1"  # Mondays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkcheck:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Check the links of the documentation
        run: uv run --frozen --python 3.14 --group docs sphinx-build -b linkcheck docs docs/_build/linkcheck
